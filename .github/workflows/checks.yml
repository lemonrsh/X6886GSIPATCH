name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Android-style test shells
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mksh busybox
          mkdir -p "$RUNNER_TEMP/x6886-shells"
          ln -s "$(command -v busybox)" "$RUNNER_TEMP/x6886-shells/ash"
          echo "$RUNNER_TEMP/x6886-shells" >> "$GITHUB_PATH"

      - name: Shell syntax (bash and dash)
        shell: bash
        run: |
          set -euo pipefail
          for script in ./*.sh META-INF/com/google/android/update-binary; do
            bash -n "$script"
            dash -n "$script"
          done

      - name: Reliability regression tests
        shell: bash
        run: python3 -B -m unittest discover -s .github/tests -p 'test_*.py' -v
